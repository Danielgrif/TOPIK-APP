<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6c5ce7" />
    <title>Нет соединения — TOPIK II Master Pro</title>
    <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f3ff;
      color: #2d3436;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 32px 24px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(108, 92, 231, 0.16);
    }
    .icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      color: #6c5ce7;
    }
    p {
      margin: 0 0 24px;
      font-size: 15px;
      line-height: 1.5;
      color: #636e72;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 28px;
      background: #6c5ce7;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.97);
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1b4b;
        color: #f5f3ff;
      }
      .card {
        background: #312e81;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      }
      p {
        color: #c7d2fe;
      }
    }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>Вы офлайн</h1>
      <p>
        Нет подключения к интернету. Ранее загруженные слова и упражнения доступны, но новые данные
        появятся после восстановления связи.
      </p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
