[functions.retry-word-request]
verify_jwt = true
enabled = true

[functions.submit-feedback]
verify_jwt = true
enabled = true

# --- Админские функции ---
[functions.get-feedback-reports]
verify_jwt = true
enabled = true

[functions.update-feedback-status]
